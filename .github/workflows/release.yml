# ─────────────────────────────────────────────────────────
#  KhaiKhai – Release & Docker CI/CD
#
#  On push to main:
#    1. Auto-increment semver patch tag (v1.0.0 → v1.0.1)
#    2. Build client & server Docker images (matrix)
#    3. Trivy scan each image for vulnerabilities
#    4. Push to GitHub Container Registry (ghcr.io)
#    5. Create a GitHub Release with auto-generated notes
# ─────────────────────────────────────────────────────────

name: Release & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write          # create tags + releases
  packages: write          # push to GHCR

env:
  REGISTRY: ghcr.io
  # Lowercase owner/repo – GHCR requires lowercase
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  VITE_BACKEND_URL: https://khaikhaiserver.vercel.app

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# ═══════════════════════════════════════════════════════════
jobs:
  # ─── 1. Determine next version tag ─────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      changelog: ${{ steps.bump.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # need full history for tag detection

      - name: Determine next semver tag
        id: bump
        run: |
          # Find the latest tag matching vX.Y.Z
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            NEW_TAG="v1.0.0"
          else
            # Bump patch version
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

          # Generate changelog from last tag (or all commits if first release)
          if [ -n "$LATEST" ]; then
            CHANGELOG=$(git log --oneline "$LATEST"..HEAD)
          else
            CHANGELOG=$(git log --oneline -20)
          fi
          # Multi-line output
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "🏷️ Next release: $NEW_TAG"

  # ─── 2. Build, scan & push Docker images ───────────────
  build-scan:
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            context: ./client
            dockerfile: ./client/Dockerfile
            build-args: |
              VITE_BACKEND_URL=https://khaikhaiserver.vercel.app
          - name: server
            context: ./server
            dockerfile: ./server/Dockerfile
            build-args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/khaikhai-${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.version.outputs.new_tag }}
            type=raw,value=latest

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_PREFIX }}/khaikhai-${{ matrix.name }}:${{ needs.version.outputs.new_tag }}"
          format: "table"
          exit-code: "1"            # fail on CRITICAL
          severity: "CRITICAL"
          ignore-unfixed: true

      - name: Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3. Create GitHub Release ──────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [version, build-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Create Git tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.new_tag }}" -m "Release ${{ needs.version.outputs.new_tag }}"
          git push origin "${{ needs.version.outputs.new_tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: "🚀 ${{ needs.version.outputs.new_tag }}"
          body: |
            ## What's Changed

            ${{ needs.version.outputs.changelog }}

            ## Docker Images

            ```
            docker pull ${{ env.IMAGE_PREFIX }}/khaikhai-client:${{ needs.version.outputs.new_tag }}
            docker pull ${{ env.IMAGE_PREFIX }}/khaikhai-server:${{ needs.version.outputs.new_tag }}
            ```
          generate_release_notes: true
          make_latest: true
